<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Night Planner | Stay In</title>
    <link rel="icon" type="image/png" href="/images/logo.jpg" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/in.js"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="page page--in">
      <h2>Stay In</h2>
      <p class="page__intro">
        Browse trending movies and shows, or search for something specific to stream.
      </p>

      <div class="search-bar">
        <input
          type="text"
          id="movie-search-input"
          placeholder="Search for a movie or show..."
          aria-label="Search for a movie or show"
        />
        <button id="movie-search-btn" class="btn btn-accent" type="button">Search</button>
      </div>

      <ul class="movie-list"></ul>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
