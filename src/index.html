<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan your next date night with Date Night Planner — browse local events or discover trending movies to stream at home."
    />
    <title>Date Night Planner | Stay In or Go Out</title>
    <link rel="icon" type="image/png" href="/images/logo.jpg" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Target container for header partial -->
    <header id="main-header"></header>

    <main id="main-content">
      <h1 class="visually-hidden">
        Date Night Planner — Featured Ideas for Your Next Date
      </h1>

      <div class="spotlight-stack">
        <!-- Top Card: Go Out API Spotlight -->
        <article class="spotlight-card out-spotlight">
          <div class="spotlight-badge">Featured Date — Go Out</div>
          <div class="spotlight-content" id="out-spotlight-target">
            <!-- Dynamically rendered via main.js & eventsApi.mjs -->
          </div>
        </article>

        <!-- Bottom Card: Stay In API Spotlight -->
        <article class="spotlight-card in-spotlight">
          <div class="spotlight-badge">Featured Date — Stay In</div>
          <div class="spotlight-content" id="in-spotlight-target">
            <!-- Dynamically rendered via main.js & streamingApi.mjs -->
          </div>
        </article>
      </div>
    </main>

    <!-- Target container for footer partial -->
    <footer id="main-footer"></footer>
  </body>
</html>
