<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Night Planner | Stay In</title>
    <link rel="icon" type="image/png" href="/images/logo.jpg" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/in.js"></script>
  </head>

 <main>
  <div class="spotlight-stack">
    
    <!-- Top Card: Go Out API Spotlight -->
    <article class="spotlight-card out-spotlight">
      <div class="spotlight-badge">Featured Date — Go Out</div>
      <div class="spotlight-content" id="out-spotlight-target">
        <!-- Dynamically rendered via main.js & eventsApi.mjs -->
      </div>
    </article>

    <!-- Bottom Card: Stay In API Spotlight -->
    <article class="spotlight-card in-spotlight">
      <div class="spotlight-badge">Featured Date — Stay In</div>
      <div class="spotlight-content" id="in-spotlight-target">
        <!-- Dynamically rendered via main.js & streamingApi.mjs -->
      </div>
    </article>

  </div>
</main>

    <footer id="main-footer"></footer>
  </body>
</html>
